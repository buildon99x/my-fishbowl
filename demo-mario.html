<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시안 M — Mario World · My Fishbowl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Bowlby+One&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="/src/demos/mario.css" />
  </head>
  <body>
    <nav class="demo-nav" aria-label="시안 전환" data-current="M"></nav>

    <main class="page">
      <header class="page-header">
        <div class="hud">
          <span class="hud-stat"><i class="coin"></i> × 24</span>
          <span class="hud-stat"><i class="heart">♥</i> × 3</span>
          <span class="hud-stat">WORLD 1-2</span>
        </div>
        <h1 class="display">SUPER<br /><span>FISH WORLD</span></h1>
        <p class="lede">— PRESS ANY BUTTON TO START —</p>
      </header>

      <section class="stage">
        <div class="aquarium-bowl" aria-label="가상 어항">
          <div class="bg-sky" aria-hidden="true">
            <div class="cloud" style="top:18%;left:10%"></div>
            <div class="cloud" style="top:30%;right:14%;transform:scale(0.7)"></div>
            <div class="cloud" style="top:8%;left:55%;transform:scale(0.85)"></div>
          </div>
          <div class="bg-bricks" aria-hidden="true"></div>
          <div class="bg-water" aria-hidden="true"></div>

          <div class="qblock qb-1" aria-hidden="true">?</div>
          <div class="qblock qb-2" aria-hidden="true">?</div>

          <svg class="pipe" viewBox="0 0 100 110" aria-hidden="true">
            <rect x="6" y="20" width="88" height="14" fill="#1aa050" stroke="#0a4020" stroke-width="3" rx="2"/>
            <rect x="14" y="34" width="72" height="76" fill="#1aa050" stroke="#0a4020" stroke-width="3"/>
            <rect x="18" y="20" width="10" height="14" fill="#5fd07a" opacity="0.9"/>
            <rect x="18" y="38" width="10" height="68" fill="#5fd07a" opacity="0.9"/>
          </svg>

          <svg class="fish ch-fish" viewBox="0 0 120 90" aria-hidden="true">
            <ellipse cx="60" cy="78" rx="38" ry="3" fill="rgba(0,0,0,0.2)"/>
            <path d="M14 50 Q30 8 70 14 L100 4 L94 36 L116 50 L94 64 L100 86 L70 76 Q30 82 14 50 Z"
                  fill="#ff2a2a" stroke="#7a0a0a" stroke-width="3" stroke-linejoin="round"/>
            <ellipse cx="62" cy="34" rx="26" ry="7" fill="#fff" opacity="0.45"/>
            <circle cx="90" cy="40" r="11" fill="#fff" stroke="#7a0a0a" stroke-width="2.5"/>
            <circle cx="92" cy="42" r="6" fill="#1a1a1a"/>
            <circle cx="94" cy="40" r="2.5" fill="#fff"/>
            <path d="M70 64 Q82 70 94 64" stroke="#7a0a0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>

          <svg class="fish lui-fish" viewBox="0 0 120 90" aria-hidden="true">
            <ellipse cx="60" cy="78" rx="38" ry="3" fill="rgba(0,0,0,0.2)"/>
            <path d="M14 50 Q30 8 70 14 L100 4 L94 36 L116 50 L94 64 L100 86 L70 76 Q30 82 14 50 Z"
                  fill="#1aa050" stroke="#0a4020" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="90" cy="40" r="11" fill="#fff" stroke="#0a4020" stroke-width="2.5"/>
            <circle cx="92" cy="42" r="6" fill="#1a1a1a"/>
            <circle cx="94" cy="40" r="2.5" fill="#fff"/>
          </svg>

          <svg class="fish yo-fish" viewBox="0 0 120 90" aria-hidden="true">
            <ellipse cx="60" cy="78" rx="38" ry="3" fill="rgba(0,0,0,0.2)"/>
            <path d="M14 50 Q30 8 70 14 L100 4 L94 36 L116 50 L94 64 L100 86 L70 76 Q30 82 14 50 Z"
                  fill="#ffd84d" stroke="#7a5a08" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="90" cy="40" r="11" fill="#fff" stroke="#7a5a08" stroke-width="2.5"/>
            <circle cx="92" cy="42" r="6" fill="#1a1a1a"/>
            <circle cx="94" cy="40" r="2.5" fill="#fff"/>
          </svg>

          <div class="coins" aria-hidden="true">
            <span style="--x:30%;--y:36%;--d:0s"></span>
            <span style="--x:70%;--y:48%;--d:0.6s"></span>
            <span style="--x:50%;--y:28%;--d:1.2s"></span>
          </div>
        </div>

        <div class="actions" role="toolbar" aria-label="액션">
          <button class="mbtn mbtn-red" type="button"><span>＋</span>NEW</button>
          <button class="mbtn mbtn-yellow" type="button"><span>★</span>FEED</button>
          <button class="mbtn mbtn-green" type="button"><span>≋</span>CLEAN</button>
          <button class="mbtn mbtn-blue" type="button"><span>♪</span>SOUND</button>
        </div>
      </section>

      <section class="meta">
        <article class="card">
          <p class="tag">★ CHARACTER</p>
          <h3>KOKO</h3>
          <p>jumps high. <em>+2 coins per feed.</em></p>
        </article>
        <article class="card">
          <p class="tag">★ PALETTE</p>
          <div class="swatches">
            <span style="--c:#ff2a2a">mario</span>
            <span style="--c:#1aa050">luigi</span>
            <span style="--c:#ffd84d">coin</span>
            <span style="--c:#5fb6ff">sky</span>
            <span style="--c:#a85020" data-light>brick</span>
            <span style="--c:#1a1a1a" data-light>ink</span>
          </div>
        </article>
        <article class="card">
          <p class="tag">★ TYPE</p>
          <p class="t-press">PRESS START · 점수</p>
          <p class="t-bowlby">BOWLBY · 헤드라인</p>
          <p class="t-fred">Fredoka · UI</p>
        </article>
      </section>
    </main>

    <script type="module" src="/src/demos/nav.js"></script>
  </body>
</html>
