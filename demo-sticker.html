    <link rel="stylesheet" href="/src/demos/sticker.css" />

  <body>
    <nav class="demo-nav" aria-label="시안 전환">
      <a href="/demo-claymorphism.html">A</a><a href="/demo-serene.html">B</a><a href="/demo-retro.html">C</a><a href="/demo-editorial.html">D</a><a href="/demo-toon.html">E</a><a href="/demo-storybook.html">F</a><a href="/demo-kawaii.html">G</a><a href="/demo-anime.html">H</a><a href="/demo-collage.html">I</a><a href="/demo-doodle.html">J</a><a href="/demo-sticker.html" aria-current="page">K</a>

    <main class="page">
      <header class="page-header">
        <p class="kicker">시안 K · 스티커 마스코트</p>
        <h1 class="display">FISHIE <span>친구들</span></h1>
        <p class="lede">두꺼운 흰 아웃라인 · 광택 비닐 · 라인프렌즈 톤 마스코트</p>
      </header>

      <section class="stage">
        <div class="aquarium-bowl" aria-label="가상 어항">
          <div class="bubbles" aria-hidden="true">
            <span style="--x:12%;--d:0s"></span>
            <span style="--x:32%;--d:1.4s"></span>
            <span style="--x:58%;--d:2.6s"></span>
            <span style="--x:84%;--d:0.7s"></span>
          </div>

          <svg class="sticker-fish fish-a" viewBox="0 0 200 140" aria-hidden="true">
            <defs>
              <radialGradient id="gloss-a" cx="40%" cy="30%" r="60%">
                <stop offset="0%" stop-color="#ff8aa9"/>
                <stop offset="100%" stop-color="#e34d75"/>
              </radialGradient>
            </defs>
            <g class="sticker-outline">
              <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                    fill="white" stroke="white" stroke-width="14" stroke-linejoin="round" paint-order="stroke"/>
            </g>
            <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                  fill="url(#gloss-a)"/>
            <ellipse cx="100" cy="46" rx="50" ry="12" fill="white" opacity="0.35"/>
            <circle cx="150" cy="56" r="14" fill="white"/>
            <circle cx="153" cy="58" r="9" fill="#1a1a1a"/>
            <circle cx="156" cy="54" r="3.5" fill="white"/>
            <path d="M120 84 Q138 92 156 84" stroke="#1a1a1a" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <ellipse cx="100" cy="78" rx="9" ry="4" fill="#ff6b95" opacity="0.7"/>
          </svg>

          <svg class="sticker-fish fish-b" viewBox="0 0 200 140" aria-hidden="true">
            <defs>
              <radialGradient id="gloss-b" cx="40%" cy="30%" r="60%">
                <stop offset="0%" stop-color="#ffe066"/>
                <stop offset="100%" stop-color="#f59e0b"/>
              </radialGradient>
            </defs>
            <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                  fill="white" stroke="white" stroke-width="14" stroke-linejoin="round" paint-order="stroke"/>
            <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                  fill="url(#gloss-b)"/>
            <ellipse cx="100" cy="46" rx="50" ry="12" fill="white" opacity="0.35"/>
            <circle cx="150" cy="56" r="14" fill="white"/>
            <circle cx="153" cy="58" r="9" fill="#1a1a1a"/>
            <circle cx="156" cy="54" r="3.5" fill="white"/>
          </svg>

          <svg class="sticker-fish fish-c" viewBox="0 0 200 140" aria-hidden="true">
            <defs>
              <radialGradient id="gloss-c" cx="40%" cy="30%" r="60%">
                <stop offset="0%" stop-color="#a3e9ff"/>
                <stop offset="100%" stop-color="#0ea5e9"/>
              </radialGradient>
            </defs>
            <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                  fill="white" stroke="white" stroke-width="14" stroke-linejoin="round" paint-order="stroke"/>
            <path d="M30 70 Q60 22 130 26 L168 14 L162 56 L196 70 L162 84 L168 126 L130 114 Q60 118 30 70 Z"
                  fill="url(#gloss-c)"/>
            <ellipse cx="100" cy="46" rx="50" ry="12" fill="white" opacity="0.35"/>
            <circle cx="150" cy="56" r="14" fill="white"/>
            <circle cx="153" cy="58" r="9" fill="#1a1a1a"/>
            <circle cx="156" cy="54" r="3.5" fill="white"/>
          </svg>
        </div>

        <div class="actions" role="toolbar" aria-label="액션">
          <button class="sbtn sbtn-pink" type="button"><span>＋</span>친구</button>
          <button class="sbtn sbtn-yellow" type="button"><span>●</span>먹이</button>
          <button class="sbtn sbtn-cyan" type="button"><span>≋</span>청소</button>
          <button class="sbtn sbtn-purple" type="button"><span>♪</span>음악</button>
        </div>
      </section>

      <section class="meta">
        <article class="card">
          <p class="tag">PROFILE</p>
          <h3>코코</h3>
          <p>핑크 마스코트 · 동그란 눈 · 늘 배고픔</p>
        </article>
        <article class="card">
          <p class="tag">COLORS</p>
          <div class="swatches">
            <span style="--c:#ff8aa9">pink</span>
            <span style="--c:#ffe066">sun</span>
            <span style="--c:#a3e9ff">aqua</span>
            <span style="--c:#c8b6ff">lila</span>
            <span style="--c:#1a1a1a" data-light>ink</span>
            <span style="--c:#ffffff" data-dark>vinyl</span>
          </div>
        </article>
        <article class="card">
          <p class="tag">TYPE</p>
          <p class="t-han">Black Han Sans · 헤드라인</p>
          <p class="t-jua">Jua · UI</p>
          <p class="t-gaegu">Gaegu · 캡션</p>
        </article>
      </section>
    </main>
  </body>
</html>
