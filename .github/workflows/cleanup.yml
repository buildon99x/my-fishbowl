name: Code Cleanup

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Detect unused files, exports, and dependencies
        run: npx --yes knip --reporter compact
        continue-on-error: ${{ github.event_name == 'schedule' }}
      - name: Detect unused dependencies
        run: npx --yes depcheck --ignores="@eslint/js,vite,vitest,eslint"
        continue-on-error: ${{ github.event_name == 'schedule' }}
