<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시안 L — Pikmin Garden · My Fishbowl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sniglet:wght@400;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="stylesheet" href="/src/demos/pikmin.css" />
  </head>
  <body>
    <nav class="demo-nav" aria-label="시안 전환" data-current="L"></nav>

    <main class="page">
      <header class="page-header">
        <p class="kicker">PROPOSAL · L</p>
        <h1 class="display">tiny garden, <span>tiny friends</span></h1>
        <p class="lede">미니어처 정원 세계 · 새싹 머리 생물 · 거대한 자연물 · 따뜻한 흙냄새</p>
      </header>

      <section class="stage">
        <div class="aquarium-bowl" aria-label="가상 어항">
          <div class="sky"></div>
          <div class="sun"></div>
          <div class="grass" aria-hidden="true">
            <span class="blade" style="--x:6%;--h:54px"></span>
            <span class="blade" style="--x:18%;--h:42px"></span>
            <span class="blade" style="--x:28%;--h:60px"></span>
            <span class="blade" style="--x:40%;--h:48px"></span>
            <span class="blade" style="--x:62%;--h:56px"></span>
            <span class="blade" style="--x:78%;--h:46px"></span>
            <span class="blade" style="--x:92%;--h:52px"></span>
          </div>
          <div class="petals" aria-hidden="true">
            <span style="--c:#ffb1d8;--x:8%;--y:18%;--d:0s"></span>
            <span style="--c:#ffd86b;--x:74%;--y:28%;--d:2s"></span>
            <span style="--c:#fff;--x:42%;--y:8%;--d:4s"></span>
            <span style="--c:#ffb1d8;--x:88%;--y:60%;--d:1s"></span>
          </div>

          <svg class="pik pik-red" viewBox="0 0 80 110" aria-hidden="true">
            <ellipse cx="40" cy="98" rx="22" ry="4" fill="rgba(40,30,20,0.25)"/>
            <path d="M40 28 Q14 40 18 76 Q22 96 40 96 Q58 96 62 76 Q66 40 40 28 Z"
                  fill="#e63a3a" stroke="#5a1010" stroke-width="2"/>
            <path d="M22 60 Q40 70 58 60" stroke="#5a1010" stroke-width="2" fill="none"/>
            <circle cx="32" cy="58" r="5" fill="#fff" stroke="#5a1010" stroke-width="1.5"/>
            <circle cx="48" cy="58" r="5" fill="#fff" stroke="#5a1010" stroke-width="1.5"/>
            <circle cx="33" cy="59" r="2.5" fill="#1a0a0a"/>
            <circle cx="49" cy="59" r="2.5" fill="#1a0a0a"/>
            <path d="M40 12 L40 28" stroke="#3d5a2a" stroke-width="3" fill="none"/>
            <path d="M40 8 Q26 6 28 16 Q40 14 40 12 Q40 14 52 16 Q54 6 40 8 Z" fill="#5b8c2a" stroke="#2a4a16" stroke-width="1.8"/>
          </svg>

          <svg class="pik pik-yellow" viewBox="0 0 80 110" aria-hidden="true">
            <ellipse cx="40" cy="98" rx="22" ry="4" fill="rgba(40,30,20,0.25)"/>
            <path d="M40 28 Q14 40 18 76 Q22 96 40 96 Q58 96 62 76 Q66 40 40 28 Z"
                  fill="#f5c842" stroke="#6a4a08" stroke-width="2"/>
            <circle cx="32" cy="58" r="5" fill="#fff" stroke="#6a4a08" stroke-width="1.5"/>
            <circle cx="48" cy="58" r="5" fill="#fff" stroke="#6a4a08" stroke-width="1.5"/>
            <circle cx="33" cy="59" r="2.5" fill="#1a0a0a"/>
            <circle cx="49" cy="59" r="2.5" fill="#1a0a0a"/>
            <path d="M40 14 L40 28" stroke="#3d5a2a" stroke-width="3" fill="none"/>
            <circle cx="40" cy="10" r="6" fill="#ffd86b" stroke="#a86a08" stroke-width="1.8"/>
            <circle cx="40" cy="10" r="2" fill="#ff9020"/>
          </svg>

          <svg class="pik pik-blue" viewBox="0 0 80 110" aria-hidden="true">
            <ellipse cx="40" cy="98" rx="22" ry="4" fill="rgba(40,30,20,0.25)"/>
            <path d="M40 28 Q14 40 18 76 Q22 96 40 96 Q58 96 62 76 Q66 40 40 28 Z"
                  fill="#3a8de8" stroke="#0e3a6a" stroke-width="2"/>
            <ellipse cx="40" cy="78" rx="10" ry="5" fill="#1d5a9a" opacity="0.7"/>
            <circle cx="32" cy="58" r="5" fill="#fff" stroke="#0e3a6a" stroke-width="1.5"/>
            <circle cx="48" cy="58" r="5" fill="#fff" stroke="#0e3a6a" stroke-width="1.5"/>
            <circle cx="33" cy="59" r="2.5" fill="#1a0a0a"/>
            <circle cx="49" cy="59" r="2.5" fill="#1a0a0a"/>
            <path d="M40 12 L40 28" stroke="#3d5a2a" stroke-width="3" fill="none"/>
            <path d="M30 4 Q20 6 24 14 L30 12 L30 16 L40 12 L50 16 L50 12 L56 14 Q60 6 50 4 Q44 10 40 6 Q36 10 30 4 Z"
                  fill="#fff7c2" stroke="#a8851a" stroke-width="1.6"/>
            <circle cx="40" cy="9" r="2.5" fill="#ffaa20"/>
          </svg>

          <svg class="pik pik-purple" viewBox="0 0 80 110" aria-hidden="true">
            <ellipse cx="40" cy="98" rx="22" ry="4" fill="rgba(40,30,20,0.25)"/>
            <path d="M40 28 Q14 40 18 76 Q22 96 40 96 Q58 96 62 76 Q66 40 40 28 Z"
                  fill="#9a6ad6" stroke="#3a1a5a" stroke-width="2"/>
            <circle cx="32" cy="58" r="5" fill="#fff" stroke="#3a1a5a" stroke-width="1.5"/>
            <circle cx="48" cy="58" r="5" fill="#fff" stroke="#3a1a5a" stroke-width="1.5"/>
            <circle cx="33" cy="59" r="2.5" fill="#1a0a0a"/>
            <circle cx="49" cy="59" r="2.5" fill="#1a0a0a"/>
            <path d="M40 14 L40 28" stroke="#3d5a2a" stroke-width="3" fill="none"/>
            <path d="M30 4 Q20 6 24 14 L30 12 L30 16 L40 12 L50 16 L50 12 L56 14 Q60 6 50 4 Q44 10 40 6 Q36 10 30 4 Z"
                  fill="#ffb1d8" stroke="#a8366a" stroke-width="1.6"/>
          </svg>

          <svg class="mushroom" viewBox="0 0 120 80" aria-hidden="true">
            <ellipse cx="60" cy="76" rx="44" ry="4" fill="rgba(40,30,20,0.25)"/>
            <rect x="50" y="40" width="20" height="36" rx="10" fill="#f3e9d0" stroke="#7a5828" stroke-width="2"/>
            <path d="M10 42 Q60 -10 110 42 Q60 56 10 42 Z" fill="#e08040" stroke="#6a2a10" stroke-width="2.4"/>
            <circle cx="34" cy="32" r="6" fill="#fff7e6" stroke="#6a2a10" stroke-width="1.5"/>
            <circle cx="60" cy="22" r="7" fill="#fff7e6" stroke="#6a2a10" stroke-width="1.5"/>
            <circle cx="86" cy="32" r="6" fill="#fff7e6" stroke="#6a2a10" stroke-width="1.5"/>
          </svg>
        </div>

        <div class="actions" role="toolbar" aria-label="액션">
          <button class="gbtn gbtn-red" type="button"><span>＋</span>모집</button>
          <button class="gbtn gbtn-yellow" type="button"><span>●</span>먹이</button>
          <button class="gbtn gbtn-blue" type="button"><span>≋</span>청소</button>
          <button class="gbtn gbtn-purple" type="button"><span>♪</span>휘파람</button>
        </div>
      </section>

      <section class="meta">
        <article class="card">
          <p class="tag">★ 도감</p>
          <h3>빨강 새싹</h3>
          <dl>
            <div><dt>특성</dt><dd>불에 강함</dd></div>
            <div><dt>머리</dt><dd>새싹 → 봉오리 → 꽃</dd></div>
            <div><dt>친구</dt><dd>3마리</dd></div>
          </dl>
        </article>
        <article class="card">
          <p class="tag">★ 흙 팔레트</p>
          <div class="swatches">
            <span style="--c:#e63a3a">불꽃</span>
            <span style="--c:#f5c842">햇살</span>
            <span style="--c:#3a8de8">물방울</span>
            <span style="--c:#9a6ad6" data-light>저녁</span>
            <span style="--c:#5b8c2a" data-light>잎</span>
            <span style="--c:#7a5828" data-light>흙</span>
          </div>
        </article>
        <article class="card">
          <p class="tag">★ 정원의 글씨</p>
          <p class="t-sniglet">Sniglet 800 · 헤드라인</p>
          <p class="t-fred">Fredoka 600 · UI</p>
          <p class="t-pre">Pretendard 700 · 한글 본문</p>
        </article>
      </section>
    </main>

    <script type="module" src="/src/demos/nav.js"></script>
  </body>
</html>
